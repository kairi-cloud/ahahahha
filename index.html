<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESS CUP — Турнир</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Верхнее меню (Таблетка) -->
    <header class="top-nav">
        <div class="nav-pill">
            <a href="#">Регламент</a>
            <a href="#">FAQ</a>
            <a href="#">Регистрация</a>
        </div>
    </header>

    <!-- Главный блок (Hero) -->
    <section class="hero">
        <div class="hero-container">
            
            <!-- Левая часть: Текст -->
            <div class="hero-content">
                <h1>УЧАСТВУЙ В<br><span class="purple">ПЕРВОМ</span><br>ТУРНИРЕ<br><span class="yellow-text">“DESS CUP”</span></h1>
                
                <div class="desc-box">
                    <p>*это первый тестовый турнир, проходящий в рамках Stack B. Подавай заявку и попади в команду, с которой пройдёшь весь путь до победителя. Будет весело!</p>
                </div>
                
                <button class="btn-yellow">РЕГИСТРАЦИЯ ТУТ</button>
            </div>

            <!-- Правая часть: Картинка и круг -->
            <div class="hero-image">
                <div class="bg-circle-character"></div>
                <!-- Вставьте сюда картинку кота (PNG с прозрачным фоном) -->
                <img src="img/cat.png" alt="Кот" class="cat-img">
            </div>

        </div>
    </section>

</body>
</html>
